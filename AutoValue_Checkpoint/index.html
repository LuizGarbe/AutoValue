<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoValue - Desvalorização de Veículos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ValueCar</h1>
        <p>Estimativa de desvalorização de veículos</p>
    </header>

    <main>
        <section class="card formulario">
            <h2>Dados do veículo</h2>

            <label for="modelo">Modelo</label>
            <input type="text" id="modelo" placeholder="Ex.: Honda Civic Si">

            <label for="ano">Ano de fabricação</label>
            <input type="number" id="ano" placeholder="Ex.: 2008">

            <label for="km">Quilometragem atual</label>
            <input type="number" id="km" placeholder="Ex.: 100000">

            <label for="valor">Valor atual (R$)</label>
            <input type="number" id="valor" placeholder="Ex.: 85000">

            <button onclick="calcularDesvalorizacao()">Calcular estimativa</button>
        </section>

        <section class="resultado">
            <div class="card destaque">
                <img src="police.png" alt="Ilustração de um carro">
                <h2 id="tituloResultado">Resultado</h2>
                <p id="resumo">Preencha os dados para calcular uma estimativa.</p>
            </div>

            <div class="cards-anos">
                <div class="card">
                    <h3>Em 1 ano</h3>
                    <p id="valor1">R$ 0,00</p>
                </div>
                <div class="card">
                    <h3>Em 3 anos</h3>
                    <p id="valor3">R$ 0,00</p>
                </div>
                <div class="card">
                    <h3>Em 5 anos</h3>
                    <p id="valor5">R$ 0,00</p>
                </div>
                <div class="card">
                    <h3>Em 8 anos</h3>
                    <p id="valor8">R$ 0,00</p>
                </div>
                <div class="card">
                    <h3>Em 10 anos</h3>
                    <p id="valor10">R$ 0,00</p>
                </div>
                <div class="card">
                    <h3>Em 15 anos</h3>
                    <p id="valor15">R$ 0,00</p>
                </div>
            </div>

            <div class="card">
                <h3>Desvalorização estimada</h3>
                <p id="percentual">0%</p>
                <div class="barra">
                    <div id="barraProgresso"></div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Projeto acadêmico</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
